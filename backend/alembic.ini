# Alembic 配置 —— 单引擎（business）
#
# 第 14 批起，业务库与本体库共用同一物理库（psp.db），仅有单一迁移树：
#   business -> psp.db  (alembic/versions/business/)
#
# 历史（已废弃）：
#   原 psp_ontology.db 已在第 14/15 批迁移到 psp.db；
#   原 alembic/versions/ontology/ 树已退役（第 15 批删除）；
#   原 [ontology] ini section 已删除。
#
# 注意：DB 连接串不在此文件写死，由 env.py 从 config.settings 读取，
# 以复用应用既有的 DB_BACKEND / DB_PATH / BUSINESS_DATABASE_URL 配置。

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# ── business 引擎（psp.db，含本体表）──
[business]
script_location = alembic
version_locations = alembic/versions/business
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
